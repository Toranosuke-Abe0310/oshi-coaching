<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- タブ用は小さく表示されるので「推」の一文字だけ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS のホーム画面アイコンは SVG を受け付けないため PNG（180x180）を用意する -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover : iPhone のセーフエリア（下部のホームバー）を CSS から扱えるようにする -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ec4899" />
    <meta name="description" content="推しコーチング — 推しと一緒に、なりたい自分へ。" />
    <!-- ホーム画面に追加したときの名前 -->
    <meta name="apple-mobile-web-app-title" content="推しコーチング" />
    <meta name="application-name" content="推しコーチング" />
    <title>推しコーチング</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
